networks:
  whyllm_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - whyllm_network
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: whyllm
      POSTGRES_PASSWORD: whyllm
      POSTGRES_DB: whyllm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whyllm -d whyllm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - whyllm_network
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      # Pin the runtime stage — the Dockerfile's final stage is `test`, and an
      # untargeted build defaults to it, which would run pytest instead of uvicorn.
      target: runner
    restart: unless-stopped
    networks:
      - whyllm_network
    ports:
      - "17823:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://whyllm:whyllm@postgres:5432/whyllm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - whyllm_network
    ports:
      - "14392:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXTAUTH_URL: http://localhost:14392
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: runner
    command: python -m whyllm_api.worker
    restart: unless-stopped
    # The worker is not an HTTP server, so the Dockerfile's curl healthcheck
    # would always report "unhealthy" — disable it for this service.
    healthcheck:
      disable: true
    networks:
      - whyllm_network
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://whyllm:whyllm@postgres:5432/whyllm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Test runner — built from the Dockerfile `test` stage (dev deps + suite).
  # Not started by `make up`; `make test-api` runs it via the `test` profile.
  test:
    profiles: ["test"]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: test
    networks:
      - whyllm_network
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://whyllm:whyllm@postgres:5432/whyllm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
