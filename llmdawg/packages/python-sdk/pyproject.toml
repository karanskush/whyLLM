[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmdawg"
version = "0.1.0"
description = "LLMDawg Python SDK — instrument LLM calls in under 2 minutes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "observability", "tracing", "openai", "anthropic"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]

[project.scripts]
llmdawg = "llmdawg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmdawg"]

[tool.ruff]
target-version = "py39"
line-length = 100
